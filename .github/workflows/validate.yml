name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tooling unit tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: session-distiller tests
        run: python -m unittest discover -s skills/session-distiller/tests -v
      - name: Validate skills
        run: npm run validate
      - name: Marketplace manifest is up to date
        run: npm run build:check
      - name: Claude Code plugin validator
        run: npx -y @anthropic-ai/claude-code@latest plugin validate .
