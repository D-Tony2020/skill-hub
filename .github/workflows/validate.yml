name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tooling unit tests
        run: npm test
      - name: Validate skills
        run: npm run validate
      - name: Marketplace manifest is up to date
        run: npm run build:check
      # Advisory for now: annotates skills without a current passing skill-qa report.
      # publish:local enforces the gate; switch to `npm run qa -- --strict` once every skill has a report.
      - name: skill-qa reports (advisory)
        run: npm run qa
        env:
          SKILL_QA_NO_AUTO_IDENTITY: '1'
      # Advisory until every suite member is published in the repo (skill-qa is still a draft).
      - name: Infra suite matches the repo (advisory)
        run: node tools/hub/cli.mjs suite --check || echo "::warning title=infra suite::suite members differ from the repo; see node tools/hub/cli.mjs suite"
      - name: Skill chain overview
        run: node tools/hub/cli.mjs chain
        env:
          SKILL_QA_NO_AUTO_IDENTITY: '1'
      - name: Claude Code plugin validator
        run: npx -y @anthropic-ai/claude-code@latest plugin validate .

  # Machine replacement for "a human reads the PR before merging" (Skill Hub Docs §2.5).
  # Green = this PR may be auto-merged; red = it needs a human (the reasons are in the job summary).
  # Make it a required check together with `validate` once branch protection is on.
  policy-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Auto-merge policy
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node tools/hub/cli.mjs policy --base "origin/$BASE_REF"
