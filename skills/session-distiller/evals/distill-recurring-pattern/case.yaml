schema_version: "1.1"
name: distill-recurring-pattern
expected_outcome: |
  Agent 处理两个有效会话（跳过只有一句寒暄的会话），识别出两次出现的"ERP 采购单清洗/标准化"模式，
  并把用户的两次纠正（单位按物料主数据换算成库存单位、供应商编码统一映射）作为规则写进候选。
  候选证据引用两个会话的真实轮次，评分让它排在 A 或 B 档，通过 sd validate，并生成报告。
  Agent 请用户逐条决定，没有自行采纳、生成 skill 草稿或改动 hub 目录。任何输出里都没有客户名、手机号或 token。
context:
  scaffold_script: place-files.sh
